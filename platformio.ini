[platformio]
default_envs = wlogicengine32
src_dir = .

[common]

[env:wlogicengine32]
platform = https://github.com/platformio/platform-espressif32.git#v5.2.0
board = esp32dev
framework = arduino
lib_archive = true
; Default port from Makefile
upload_port = /dev/ttyUSB0
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = 
	default
	esp32_exception_decoder
build_src_filter =
  +<*>
  -<visualizer/>
  ; test/ is the fork-owned HOST suite (clang, its own main()). src_dir is the repo
  ; ROOT here, and this filter REPLACES PlatformIO's default — whose implicit
  ; -<test/> we therefore have to restate, or the firmware build tries to compile
  ; the host tests into the ESP32 image.
  -<test/>
lib_deps =
    https://github.com/reeltwo/Reeltwo
    bblanchon/ArduinoJson @ ^6.21.3
    ; Force use of local FastLED 3.5.0 in lib folder
    ; https://github.com/FastLED/FastLED
build_type = release
build_flags = 
	-DCORE_DEBUG_LEVEL=5  ; verbose from Makefile
    -DFASTLED_RMT_MAX_CHANNELS=1  ; Critical FastLED flag from Makefile
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Os
extra_scripts = 
    pre:scripts/pre_extra.py
    post:scripts/post_build.py

; Code quality checks for wlogicengine32
check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,bugprone-*,performance-*,readability-*,-readability-magic-numbers,-readability-uppercase-literal-suffix
check_patterns =
    src/*
    include/*

[env:wlogicengine32s3]
platform = https://github.com/platformio/platform-espressif32.git#v5.2.0
board = esp32-s3-devkitc-1
framework = arduino
lib_archive = true
; Default port for ESP32S3 from Makefile
upload_port = /dev/ttyACM0
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = 
	default
	esp32_exception_decoder
build_src_filter =
  +<*>
  -<visualizer/>
  ; test/ is the fork-owned HOST suite (clang, its own main()). src_dir is the repo
  ; ROOT here, and this filter REPLACES PlatformIO's default — whose implicit
  ; -<test/> we therefore have to restate, or the firmware build tries to compile
  ; the host tests into the ESP32 image.
  -<test/>
lib_deps =
    https://github.com/reeltwo/Reeltwo
    bblanchon/ArduinoJson @ ^6.21.3
    https://github.com/FastLED/FastLED
build_type = release
build_flags = 
	-DCORE_DEBUG_LEVEL=5  ; verbose from Makefile
    -DFASTLED_RMT_MAX_CHANNELS=1  ; Critical FastLED flag from Makefile
    -DWREACTOR32_2023=1  ; ESP32S3 specific flag from Makefile
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Os
extra_scripts = 
    pre:scripts/pre_extra.py
    post:scripts/post_build.py

