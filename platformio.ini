[platformio]
default_envs = wlogicengine32
src_dir = .

[common]

[env:wlogicengine32]
platform = https://github.com/platformio/platform-espressif32.git#v5.2.0
board = esp32dev
framework = arduino
lib_archive = true
; Default port from Makefile
upload_port = /dev/ttyUSB0
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = 
	default
	esp32_exception_decoder
build_src_filter =
  +<*>
  -<visualizer/>
  ; test/ is the fork-owned HOST suite (clang, its own main()). src_dir is the repo
  ; ROOT here, and this filter REPLACES PlatformIO's default — whose implicit
  ; -<test/> we therefore have to restate, or the firmware build tries to compile
  ; the host tests into the ESP32 image.
  -<test/>
lib_deps =
    https://github.com/reeltwo/Reeltwo
    bblanchon/ArduinoJson @ ^6.21.3
    ; Force use of local FastLED 3.5.0 in lib folder
    ; https://github.com/FastLED/FastLED
build_type = release
build_flags = 
	-DCORE_DEBUG_LEVEL=5  ; verbose from Makefile
    -DFASTLED_RMT_MAX_CHANNELS=1  ; Critical FastLED flag from Makefile
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Os
extra_scripts = 
    pre:scripts/pre_extra.py
    post:scripts/post_build.py

; ---- static analysis:  pio check -e wlogicengine32 --------------------------
; check_patterns is DEPRECATED (PlatformIO warns about it on EVERY build, not just on check);
; check_src_filters is the replacement. It also fixes what the old config actually did:
;   * `src/*` + `include/*` pulled in Joymonkey/Rimim's src/main.cpp AND (via the header
;     filter) upstream headers like WebPages.h, so the run buried our ~160 contract findings
;     in ~90 warnings of other people's firmware. There is no include/ dir in this repo at
;     all, so that half of the pattern matched nothing.
;   * --checks= on the command line SILENTLY OVERRODE the curated .clang-tidy at the repo
;     root (it is appended after the config's Checks, and started with -*). The misc-* and
;     modernize-* checks in .clang-tidy — which is where the const-correctness and
;     use-override findings live — were never actually running.
;
; What replaces it:
;  1. check_src_filters picks the TRANSLATION UNIT. The contract layer is header-only, so
;     there is nothing to point clang-tidy AT except the TU that includes it — src/main.cpp.
;     Naming src/contract/ here would analyse zero files. NOTE src_dir is the repo ROOT here,
;     so this path is src/main.cpp, not main.cpp.
;  2. --line-filter picks which files may REPORT: a suffix match on the path, so only our two
;     headers survive. (--header-filter alone is not enough — clang-tidy ALWAYS reports
;     diagnostics in the main file, i.e. all of main.cpp, whatever the header filter says.)
;  3. --config-file makes the repo's .clang-tidy authoritative again, and stops PlatformIO
;     injecting its own `--checks=*` (which enables EVERY check, incl. llvmlibc/fuchsia).
;
; TARGET CAVEAT, and it is a real one: clang has no xtensa back end, so this run analyses
; ESP32 code with the HOST data model (int 32, long 64) instead of the board's (int 32,
; long 32). Integer-width bugs in the SHARED core are therefore NOT this run's job — they are
; caught by the PSI/Flthy runs, which really do model 16-bit int with --target=avr and are
; strictly stricter. This run's job is ContractLogics.h, which is ESP32-only code.
check_tool = clangtidy
check_src_filters =
    +<src/main.cpp>
check_flags =
    clangtidy: --config-file=.clang-tidy --header-filter=src/contract/ --line-filter=[{"name":"src/contract/contract_core.h"},{"name":"src/contract/ContractLogics.h"}]

[env:wlogicengine32s3]
platform = https://github.com/platformio/platform-espressif32.git#v5.2.0
; This env used to be unbuildable, and the error blamed the toolchain: platform v5.2.0
; makes toolchain-riscv32-esp NON-optional for the S3 (it is the RISC-V ULP coprocessor
; toolchain), pinning it to 8.4.0+2021r2-patch3 — which the PlatformIO registry has since
; unpublished. Only that exact patch level was pruned; patch5 is still served. NOTE the
; `platform` line is declared PER-ENVIRONMENT (there is no [env] or shared [common] here),
; so this repin touches the S3 alone and wlogicengine32 is byte-for-byte unaffected.
; The ULP toolchain is inert for us anyway: there is no ulp/ source and every object is
; built by xtensa-esp32s3-elf-g++.
platform_packages =
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board = esp32-s3-devkitc-1
framework = arduino
lib_archive = true
; Default port for ESP32S3 from Makefile
upload_port = /dev/ttyACM0
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = 
	default
	esp32_exception_decoder
build_src_filter =
  +<*>
  -<visualizer/>
  ; test/ is the fork-owned HOST suite (clang, its own main()). src_dir is the repo
  ; ROOT here, and this filter REPLACES PlatformIO's default — whose implicit
  ; -<test/> we therefore have to restate, or the firmware build tries to compile
  ; the host tests into the ESP32 image.
  -<test/>
lib_deps =
    https://github.com/reeltwo/Reeltwo
    bblanchon/ArduinoJson @ ^6.21.3
    ; FastLED comes from the vendored lib/FastLED 3.5.0, same as wlogicengine32. This used
    ; to be an UNPINNED https://github.com/FastLED/FastLED (git master) — a second, real
    ; breakage hiding under the toolchain error, and a supply-chain hazard on its own.
build_type = release
build_flags = 
	-DCORE_DEBUG_LEVEL=5  ; verbose from Makefile
    -DFASTLED_RMT_MAX_CHANNELS=1  ; Critical FastLED flag from Makefile
    -DWREACTOR32_2023=1  ; ESP32S3 specific flag from Makefile
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -Os
extra_scripts = 
    pre:scripts/pre_extra.py
    post:scripts/post_build.py

